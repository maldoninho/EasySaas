services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: easysaas
      POSTGRES_USER: easysaas
      POSTGRES_PASSWORD: easysaas
    ports:
      - "5432:5432"
    volumes:
      - easysaas_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easysaas -d easysaas"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  easysaas_postgres_data:
